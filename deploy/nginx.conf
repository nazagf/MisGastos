# Ubuntu: /etc/nginx/sites-available/misgastos
# Reemplazar gastos.example.com y obtener el certificado ANTES de habilitar este archivo.
limit_req_zone $binary_remote_addr zone=misgastos_login:10m rate=10r/m;

server {
    listen 80;
    server_name gastos.example.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://gastos.example.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name gastos.example.com;
    ssl_certificate /etc/letsencrypt/live/gastos.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gastos.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /static/ {
        alias /srv/misgastos/staticfiles/;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /login/ {
        limit_req zone=misgastos_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8010;
    }
    location / {
        proxy_pass http://127.0.0.1:8010;
    }
}
