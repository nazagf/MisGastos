{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · MisGastos</title>
  <link rel="icon" href="{% static 'Gastos/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'Gastos/css/login.css' %}">
</head>
<body>
  <main class="login-card">
    <p class="brand">$ MisGastos</p>
    <h1>Tu estado de cuenta</h1>
    <p class="intro">Ingresá para consultar y registrar tus gastos.</p>
    {% if form.errors %}<p class="error" role="alert">No pudimos iniciar sesión con esos datos.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label for="id_username">Usuario</label>
      <input id="id_username" name="username" autocomplete="username" maxlength="150" required autofocus value="{{ form.username.value|default:'' }}">
      <label for="id_password">Contraseña</label>
      <input id="id_password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Ingresar</button>
    </form>
    <p class="private">Acceso privado. No hay registro público.</p>
  </main>
</body>
</html>
